<style>
/* ============ OVERLAY PIECES ============ */
.ov{position:absolute;inset:0;overflow:hidden;font-family:var(--font);-webkit-font-smoothing:antialiased}
.ov *{box-sizing:border-box}
.ov .m{position:absolute}
.ov .m.plug{left:20px;top:50%;transform:translateY(-50%)}
.ov .m.chat{left:20px;right:20px;bottom:20px}
.ov .m.shout{left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100% - 40px)}

.ov .progress{position:absolute;left:22px;right:22px;bottom:0;height:2px;border-radius:2px;background:var(--accent);opacity:.85;transform:scaleX(0);transform-origin:left;z-index:1}
.ov .progress.run{animation:ovfill linear forwards}
@keyframes ovfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* social plug */
.ov .pcard{position:relative;display:flex;align-items:center;gap:24px;min-width:440px;
  padding:24px 46px 28px 30px;border:1px solid var(--edge);border-radius:var(--r);
  clip-path:inset(0 100% 0 0 round var(--r));transition:clip-path 1s cubic-bezier(.77,0,.18,1),border-color .6s ease}
.ov .pcard.in{clip-path:inset(0 0 0 0 round var(--r))}
.ov .pcard .bgs{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:0}
.ov .pcard .bg{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
.ov .pcard .bg.on{opacity:1}
.ov .pcard>.rule,.ov .pcard>.item{position:relative;z-index:1}
.ov .pcard .rule{width:3px;border-radius:3px;height:96px;background:var(--accent);transform:scaleY(0);transform-origin:top;
  transition:transform .7s cubic-bezier(.77,0,.18,1) .45s}
.ov .pcard.in .rule{transform:scaleY(1)}
.ov .item{transition:opacity .4s ease,transform .4s ease}
.ov .item.hide{opacity:0;transform:translateY(5px)}
.ov .pcard .intro{font-size:18px;font-weight:500;letter-spacing:.01em;color:var(--muted);margin-bottom:2px}
.ov .pcard .platform{font-weight:600;font-size:48px;line-height:1.05;letter-spacing:-.005em;color:var(--text)}
.ov .pcard .handle{font-size:24px;font-weight:600;letter-spacing:.02em;color:var(--accent);margin-top:6px}
.ov .pcard.branded{border-color:rgba(255,255,255,.16)}
.ov .pcard .badge{display:none}
.ov .lrow{display:inline-flex;align-items:center;padding:16px 48px 16px 16px;background:var(--panel);border:1px solid var(--edge);
  border-radius:999px;clip-path:inset(0 100% 0 0 round 999px);transition:clip-path 1s cubic-bezier(.77,0,.18,1)}
.ov .lrow.in{clip-path:inset(0 0 0 0 round 999px)}
.ov .lrow .grp{display:flex;align-items:center;gap:24px;transition:opacity .4s ease,transform .4s ease}
.ov .lrow .grp.hide{opacity:0;transform:translateY(6px)}
.ov .lrow .lb{flex:none;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;transform:scale(.7);opacity:0;transition:opacity .45s ease .35s,transform .6s cubic-bezier(.2,.8,.2,1) .35s,background .5s ease}
.ov .lrow.in .lb{opacity:1;transform:none}
.ov .lrow .lb img{width:58%;height:58%;object-fit:contain}
.ov .lrow .lb.logo{background:transparent!important;box-shadow:none;border-radius:0}
.ov .lrow .lb.logo img{width:100%;height:100%}
.ov .lrow .lb span{font-weight:700;font-size:42px}
.ov .lrow .un{font-size:54px;font-weight:600;letter-spacing:.005em;color:var(--text);white-space:nowrap;line-height:1}
.ov .lrow .progress{left:60px;right:60px}
.ov .pcard.compact{gap:14px;min-width:0;padding:12px 30px 13px 12px;border-radius:calc(var(--r) * 2.4);
  clip-path:inset(0 100% 0 0 round calc(var(--r) * 2.4))}
.ov .pcard.compact.in{clip-path:inset(0 0 0 0 round calc(var(--r) * 2.4))}
.ov .pcard.compact .bgs{border-radius:calc(var(--r) * 2.4 - 1px)}
.ov .pcard.compact .rule{display:none}
.ov .pcard.compact .badge{display:flex;position:relative;z-index:1;flex:none;width:52px;height:52px;border-radius:50%;
  align-items:center;justify-content:center;overflow:hidden;background:var(--bb,var(--accent));box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;
  transition:background .5s ease}
.ov .pcard .badge img{width:60%;height:60%;object-fit:contain;display:none}
.ov .pcard .badge.has-img img{display:block;width:100%;height:100%}
.ov .pcard.compact .badge.has-img{background:transparent!important;box-shadow:none;border-radius:0}
.ov .pcard .badge.has-img .mono{display:none}
.ov .pcard .badge .mono{font-weight:700;font-size:22px;color:var(--bf,#fff)}
.ov .pcard.compact .item{display:flex;flex-direction:column}
.ov .pcard.compact .platform{order:1;font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--muted);line-height:1.2}
.ov .pcard.compact .handle{order:2;font-size:23px;font-weight:600;color:var(--text);margin:0;line-height:1.2}
.ov .pcard.compact .intro{order:3;font-size:14px;font-weight:500;color:var(--muted);margin:2px 0 0;opacity:1}
.ov .pcard.compact.logo .platform{display:none}
.ov .pcard.compact .progress{left:40px;right:40px}
.ov .pcard.branded .intro{color:var(--pfg);opacity:.85}
.ov .pcard .intro:empty{display:none}
.ov .pcard.branded .platform,.ov .pcard.branded .handle{color:var(--pfg)}
.ov .pcard.branded .rule{background:var(--pacc)}
.ov .pcard.branded .progress{background:var(--pfg)}

/* chat */
.ov .chat .list{display:flex;flex-direction:column;gap:10px}
.ov .msg{background:var(--panel);border:1px solid var(--edge);border-radius:calc(var(--r) * .8);padding:12px 20px 14px;animation:ovin .55s cubic-bezier(.2,.8,.2,1) both}
.ov .msg.leave{animation:ovout .7s ease forwards}

/* shoutout + note */

  transition:clip-path 1.1s cubic-bezier(.77,0,.18,1),opacity .3s ease}

  font-size:34px;font-weight:500;color:var(--accent);
  transform:scale(.85);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.2,1) .55s,opacity .6s ease .55s}

function readableOn(hex){
  const h = (hex || "#000000").replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);

  return L > .4 ? "#000000" : "#FFFFFF";

const b64url = bytes => { let bin = ""; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64url = str => { const b = atob(str.replace(/-/g, "+").replace(/_/g, "/")); const out = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) out[i] = b.charCodeAt(i); return out; };
async function packCfg(obj){
  const json = JSON.stringify(obj);
  if (window.CompressionStream){
    const st = new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return "z" + b64url(new Uint8Array(await new Response(st).arrayBuffer()));
  }
  return "j" + b64url(new TextEncoder().encode(json));
}
async function unpackCfg(str){
  const bytes = unb64url(str.slice(1));
  if (str[0] === "z"){
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return JSON.parse(await new Response(st).text());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* turns any incoming TikTok message into { event, data } with plain fields */
function ttNormalize(m){
  if (!m || typeof m !== "object") return null;
  if (m.event && m.data && !m.type) return m;                      // already simple
  const type = String(m.type || m.messageType || m.method || "");
  const d = m.data || m;
  const u = d.user || {};
  const id = d.userIdentity || u.userIdentity || {};
  const base = {
    uniqueId: u.uniqueId || u.displayId || d.uniqueId || "",
    nickname: u.nickname || d.nickname || u.uniqueId || "",
    isModerator: !!(id.isModeratorOfAnchor || d.isModerator),
    isSubscriber: !!(id.isSubscriberOfAnchor || d.isSubscriber),
    followRole: +(u.followInfo && u.followInfo.followStatus) || (id.isFollowerOfAnchor ? 1 : 0) || +d.followRole || 0,
  };
  const gd = d.giftDetails || d.gift || {};
  if (/Chat/i.test(type)) return { event: "chat", data: Object.assign(base, { comment: d.comment || "", emotes: d.emotes || [] }) };
  if (/Gift/i.test(type)) return { event: "gift", data: Object.assign(base, {
    giftName: gd.giftName || gd.name || d.giftName || "gift", giftType: gd.giftType != null ? gd.giftType : d.giftType,
    diamondCount: gd.diamondCount != null ? gd.diamondCount : d.diamondCount, repeatCount: d.repeatCount, repeatEnd: d.repeatEnd }) };
  if (/Like/i.test(type)) return { event: "like", data: Object.assign(base, { likeCount: d.likeCount || d.count, totalLikeCount: d.totalLikeCount || d.total }) };
  if (/Social/i.test(type)){
    const key = String((d.common && d.common.displayText && d.common.displayText.key) || d.displayType || "");
    const act = +d.action;
    if (/follow/i.test(key) || act === 1) return { event: "follow", data: base };
    if (/share/i.test(key) || act === 3) return { event: "share", data: base };
    return null;
  }
  if (/Follow/i.test(type)) return { event: "follow", data: base };
  if (/Share/i.test(type)) return { event: "share", data: base };
  if (/Sub/i.test(type)) return { event: "subscribe", data: base };
  return { event: "other", data: base };
}
function ttMessages(raw){
  let d; try { d = JSON.parse(raw); } catch (e) { return []; }
  const list = Array.isArray(d) ? d : Array.isArray(d.messages) ? d.messages : [d];
  return list.map(ttNormalize).filter(Boolean);
}

function loadFont(name){

  const id = "font-" + name.replace(/\s/g, "-");
  if (document.getElementById(id)) return;

  l.id = id; l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?family=" + name.replace(/\s/g, "+") + ":wght@400;500;600&display=swap";
  document.head.append(l);
}
function rgba(hex, a){
  const h = (hex || "#000000").replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(c => c + c).join("") : h, 16);
  return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
}

    };
    const show = s => {

        const badge = q(".badge"), img = q(".badge img");

    };
  }

  if (piece === "shoutout"){
    const c = cfg.shout;
    const m = mod("shout", '<div class="scard"><div class="seal"></div><div class="copy"><div class="sintro"></div><div class="title"></div><div class="sub"></div><div class="line"></div></div><div class="progress"></div></div>');
    const q = s => m.querySelector(s), card = q(".scard");
    const secs = Math.max(2, +c.seconds || 9);
    const queue = []; let busy = false;
    const render = x => {
      card.classList.toggle("note", x.type === "note");
      if (x.type === "so"){
        q(".seal").textContent = x.user.charAt(0).toUpperCase();
        q(".sintro").textContent = c.soIntro;
        q(".title").textContent = x.user;
        q(".sub").textContent = x.source === "tiktok" ? "tiktok.com/@" + x.user : "twitch.tv/" + x.user.toLowerCase();
        q(".line").textContent = c.soLine;
      } else if (x.type === "event"){
        q(".seal").textContent = x.seal || x.user.charAt(0).toUpperCase();
        q(".sintro").textContent = x.intro;
        q(".title").textContent = x.user;
        q(".sub").textContent = x.line;
        q(".line").textContent = x.link || "";
      } else {
        q(".seal").textContent = "\u2726";
        q(".sintro").textContent = c.noteIntro;
        q(".title").textContent = x.text;
        q(".sub").textContent = ""; q(".line").textContent = "";
      }
    };
    const next = async () => {
      if (!queue.length){ busy = false; return; }
      busy = true;
      render(queue.shift());
      card.classList.add("in");
      restart(q(".progress"), secs);
      await sleep(secs * 1000);
      card.classList.remove("in");
      await sleep(1300);
      next();
    };
    const makeEvent = (k, v) => {
      const t = TRIGGERS.find(t => t.k === k), set = (c.triggers || {})[k];
      if (!t || !set || !v || !v.user) return null;
      const vars = Object.assign({}, v, { name: v.user, gifts: +v.amount === 1 ? "a sub" : (v.amount || 0) + " subs" });
      const fillT = str => String(str || "").replace(/\{(\w+)\}/g, (m, key) => vars[key] != null ? vars[key] : m);
      return { type: "event", user: v.user, seal: v.seal, intro: fillT(set.intro), line: fillT(set.line),
        link: t.link ? "twitch.tv/" + String(v.user).toLowerCase() : "" };
    };
    onEvent = (k, v) => {
      const set = (c.triggers || {})[k];
      if (!set || !set.on || !v || !v.user) return;
      if (set.min != null && (+(k === "ttgift" ? v.coins : v.amount) || 0) < +set.min) return;
      const ev = makeEvent(k, v);
      if (!ev || queue.length >= 10) return;
      queue.push(ev);
      if (!busy) next();
    };
    const SF = opts.focus && opts.focus.piece === "shoutout" ? opts.focus : null;
    if (SF){
      let held = null;
      if (SF.trigger){ const t = TRIGGERS.find(t => t.k === SF.trigger); if (t) held = makeEvent(SF.trigger, t.sample); }
      else if (SF.shout === "note") held = { type: "note", text: "Giveaway draw at 10 PM tonight" };
      else held = { type: "so", user: "MidnightMika", source: cfg.kind === "tiktok" ? "tiktok" : "twitch" };
      if (held) later(() => { if (busy) return; render(held); card.classList.add("in"); }, 120);
    }
    const clean = s => (s || "").trim().replace(/^!/, "").toLowerCase();
    trigger = (raw, source) => {
      const parts = (raw || "").trim().split(/\s+/);
      const cmd = clean(parts.shift());
      if (!parts.length) return;
      if (cmd === clean(c.soCmd || "so")){
        let src = source || (cfg.kind === "tiktok" ? "tiktok" : "twitch");
        if (parts.length > 1 && /^(tt|tiktok)$/i.test(parts[parts.length - 1])) src = "tiktok";
        queue.push({ type: "so", user: parts[0].replace(/^@/, ""), source: src });
      } else if (cmd === clean(c.noteCmd || "note")) queue.push({ type: "note", text: parts.join(" ") });
      else return;
      if (!busy) next();
    };
  }

  /* live connections (chat and shoutout pieces only) */
  const onLine = line => {
    if (!line) return;
    if (line.startsWith("PING")){ ws.send("PONG :tmi.twitch.tv"); return; }
    const m = line.match(/^(?:@(\S+) )?:(\S+) (\w+) #\S+(?: :(.*))?$/);
    if (!m) return;
    const tags = {};
    (m[1] || "").split(";").forEach(t => { const i = t.indexOf("="); if (i > 0) tags[t.slice(0, i)] = t.slice(i + 1); });
    const login = m[2].split("!")[0].toLowerCase(), type = m[3];
    let text = m[4] || "";
    if (tags["room-id"]) onRoomId(tags["room-id"]);
    const un = v => (v || "").replace(/\\s/g, " ");
    if (type === "USERNOTICE"){
      const id = tags["msg-id"], who = un(tags["display-name"] || tags.login);
      if (id === "raid") onEvent("raid", { user: un(tags["msg-param-displayName"]) || who, viewers: +tags["msg-param-viewerCount"] || 0 });
      else if (id === "sub") onEvent("sub", { user: who });
      else if (id === "resub") onEvent("resub", { user: who, months: +tags["msg-param-cumulative-months"] || 1 });
      else if (id === "submysterygift") onEvent("giftsub", { user: who, amount: +tags["msg-param-mass-gift-count"] || 1 });
      else if (id === "subgift" && !tags["msg-param-community-gift-id"]) onEvent("giftsub", { user: who, amount: 1, recipient: un(tags["msg-param-recipient-display-name"]) });
      return;
    }
    if (type === "PRIVMSG"){
      liveSeen = true;
      const b = tags.badges || "";
      const shown = un(tags["display-name"] || login);
      if (+tags.bits > 0) onEvent("bits", { user: shown, amount: +tags.bits });
      if (tags["first-msg"] === "1") onEvent("firstchat", { user: shown });
      if (text.startsWith("!") && (b.includes("broadcaster/") || tags.mod === "1")) trigger(text, "twitch");
      if (!addMsg) return;
      if (text.startsWith("\u0001ACTION ")) text = text.slice(8).replace(/\u0001$/, "");
      const role = b.includes("broadcaster/") ? "host" : (b.includes("moderator/") || tags.mod === "1") ? "mod" : b.includes("vip/") ? "vip"
        : (tags.subscriber === "1" || b.includes("subscriber/") || b.includes("founder/")) ? "sub" : "viewer";
      addMsg({ id: tags.id, user: login, role, text, emotes: tags.emotes, source: "twitch", name: (tags["display-name"] || login).replace(/\\s/g, " ") });
    } else if (type === "CLEARMSG"){
      ov.querySelectorAll('.msg[data-id="' + tags["target-msg-id"] + '"]').forEach(n => n.remove());
    } else if (type === "CLEARCHAT"){
      ov.querySelectorAll(text ? '.msg[data-user="' + text.toLowerCase() + '"]' : ".msg").forEach(n => n.remove());
    }
  };
  const connectTwitch = () => {
    ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
    ws.onopen = () => {
      ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      ws.send("PASS SCHMOOPIIE");
      ws.send("NICK justinfan" + (10000 + Math.floor(Math.random() * 80000)));
      ws.send("JOIN #" + chan);
    };
    ws.onmessage = e => e.data.split("\r\n").forEach(onLine);
    ws.onclose = () => later(connectTwitch, 3000);
  };
  const likedBy = new Map(), likeFired = new Set();
  let goalSeen = false, lastGoal = 0;
  const handleTT = d => {
      if (!d || !d.data || d.event === "other") return;
      liveSeen = true;
      const x = d.data;
      const who = x.nickname || x.uniqueId || "";
      const kind = d.event === "social" ? (/follow/i.test(x.displayType || "") ? "follow" : /share/i.test(x.displayType || "") ? "share" : "") : d.event;
      if (kind === "follow") return onEvent("ttfollow", { user: who });
      if (kind === "share") return onEvent("ttshare", { user: who });
      if (kind === "like"){
        const T = (cfg.shout && cfg.shout.triggers) || {};
        const u = String(x.uniqueId || who).toLowerCase(), add = +x.likeCount || 0;
        if (T.ttlike && T.ttlike.on && add && !likeFired.has(u)){
          const need = Math.max(1, +T.ttlike.min || 100), total = (likedBy.get(u) || 0) + add;
          likedBy.set(u, total);
          if (total >= need){ likeFired.add(u); onEvent("ttlike", { user: who, amount: total }); }
        }
        if (T.ttlikegoal && T.ttlikegoal.on && +x.totalLikeCount){
          const step = Math.max(1, +T.ttlikegoal.min || 1000), g = Math.floor(+x.totalLikeCount / step) * step;
          if (!goalSeen){ goalSeen = true; lastGoal = g; }
          else if (g > lastGoal){ lastGoal = g; onEvent("ttlikegoal", { user: g.toLocaleString() + " likes", amount: g, seal: "\u2665" }); }
        }
        return;
      }
      if (kind === "subscribe") return onEvent("ttsub", { user: who });
      if (kind === "gift"){
        if (+x.giftType === 1 && !x.repeatEnd) return;
        const amount = +x.repeatCount || 1;
        return onEvent("ttgift", { user: who, amount, gift: x.giftName || "gift", coins: (+x.diamondCount || 0) * amount });
      }
      if (d.event !== "chat") return;
      const ttEmotes = (Array.isArray(x.emotes) ? x.emotes : []).map(e => ({
        pos: +(e.placeInComment != null ? e.placeInComment : e.index) || 0,
        url: e.emoteImageUrl || (e.emote && e.emote.image && (e.emote.image.imageUrl || (e.emote.image.url_list || e.emote.image.url || [])[0])) || "",
      })).filter(e => e.url);
      const text = String(x.comment || x.message || "");
      const user = String(x.uniqueId || "").toLowerCase();
      const isHost = !!ttUser && user === ttUser, isMod = !!x.isModerator;
      if (text.startsWith("!") && (isHost || isMod)) trigger(text, "tiktok");
      const role = isHost ? "host" : isMod ? "mod" : x.isSubscriber ? "sub" : (+x.followRole >= 1) ? "follower" : "viewer";
      if (addMsg) addMsg({ user, name: x.nickname || x.uniqueId || "viewer", role, text, ttEmotes, source: "tiktok" });
  };
  const ttKey = (cfg.tiktok && cfg.tiktok.key) || "";
  const connectTikTok = () => {
    if (DESKTOP){
      tws = new WebSocket("ws://" + location.host + "/events");
      tws.onmessage = e => {
        let m; try { m = JSON.parse(e.data); } catch (err) { return; }
        if (m.kind === "tiktok"){ const d = ttNormalize({ type: m.type, data: m.data }); if (d) handleTT(d); }
      };
      tws.onerror = () => {};
      tws.onclose = () => later(connectTikTok, 2000);
      return;
    }
    if (!ttUser) return;
    tws = new WebSocket(ttUrl(ttUser, ttKey));
    tws.onmessage = e => ttMessages(e.data).forEach(handleTT);
    tws.onerror = () => {};
    tws.onclose = e => { const c = TT_CLOSE[e.code]; if (c && !c.wait) return; later(connectTikTok, c ? c.wait : 5000); };
  };
  if (chan) connectTwitch();
  if (ttOn) connectTikTok();

  let liveSeen = false;
  if (opts.demo){
    if (piece === "chat"){
      const samples = [
        ["Mika", "viewer", "good evening everyone, the stream looks so clean tonight"],
        ["jules_ph", "mod", "reminder: be kind in chat"],
        ["Theo", "sub", "6 months already, love this community"],
        ["noor.d", "follower", "first time catching you live, followed"],
        ["Rafa", "vip", "that transition was smooth"],
        ["You", "host", "welcome in everyone \u2728"],
        ["Kai", "viewer", "\ud83d\udd25\ud83d\udd25\ud83d\udd25"],
        ["Bea", "sub", "that clutch \ud83d\ude2d\ud83d\ude4c"],
      ];
      let i = 0;
      const tick = () => { if (liveSeen) return; const [name, role, text] = samples[i++ % samples.length]; addMsg({ user: name.toLowerCase(), name, role, text }); later(tick, 2600); };
      const fr = opts.focus && opts.focus.piece === "chat" && opts.focus.role;
      if (fr){
        const NAMES = { host: "You", mod: "jules_ph", vip: "Rafa", sub: "Theo", follower: "noor.d", viewer: "Mika" };
        samples.filter(x => x[1] !== fr).slice(0, 2).forEach(([name, role, text]) => addMsg({ user: name.toLowerCase(), name, role, text }));
        addMsg({ user: "focus", name: NAMES[fr] || "Viewer", role: fr, text: "this is how their messages look" });
        later(tick, 6000);
      } else tick();
    }
    if (piece === "shoutout" && !(opts.focus && opts.focus.piece === "shoutout")){
      let flip = false;
      const demo = () => {
        if (liveSeen) return;
        trigger(flip ? (cfg.shout.noteCmd || "note") + " Giveaway draw at 10 PM tonight" : (cfg.shout.soCmd || "so") + " MidnightMika");
        flip = !flip; later(demo, 14000);
      };
      later(demo, 800);
    }
  }

  function destroy(){
    dead = true; timers.forEach(clearTimeout); timers.clear();
    [ws, tws].forEach(s => { if (s){ s.onclose = null; try { s.close(); } catch (e) {} } });
  }
  return { trigger, destroy, test: k => { const t = TRIGGERS.find(t => t.k === k); if (t) onEvent(k, t.sample); } };
}

      });

  }

    const live = st.state === "live";
    const app = { idle: ["", "Not checked"], connecting: ["wait", "Connecting"], waiting: ["ok", "Ready"], live: ["ok", "Connected"], error: ["bad", "Problem"] }[st.state] || ["", ""];
    ttSet("ttApp", app[0], app[1]);
    ttSet("ttLive", live ? "ok" : st.state === "waiting" ? "wait" : "", live ? "Live, " + st.count + " event" + (st.count === 1 ? "" : "s") : st.state === "waiting" ? "Not live yet" : "Not connected");
    ttHint(st.message || "");
    const off = st.state === "idle" || st.state === "error";
    $("ttBtn").textContent = off ? "Connect to LIVE" : "Disconnect";
    $("ttBtn").classList.toggle("on", !off);
  }
  function desktopToggle(){
    if (dState === "idle" || dState === "error"){
      if (!String(cfg.tiktok.user || "").trim()){ ttHint("Type your TikTok username above first."); return; }
      if (!cfg.tiktok.on){ cfg.tiktok.on = true; refreshInputs(); changed(); }
      fetch("/api/connect", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user: cfg.tiktok.user, key: cfg.tiktok.key }) });
    } else fetch("/api/disconnect", { method: "POST" });
  }
  if (DESKTOP){
    const listen = () => {
      const w = new WebSocket("ws://" + location.host + "/events");
      w.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } if (m.kind === "status") desktopStatus(m); };
      w.onclose = () => setTimeout(listen, 2000);
    };
    listen();
    document.querySelector(".profile-box").style.display = "none";
    const keyIn = document.querySelector('input[data-k="tiktok.key"]');
    if (keyIn){
      keyIn.closest(".field").querySelector("span").textContent = "Connection key (optional)";
      keyIn.placeholder = "Leave empty";
      const note = keyIn.closest(".field").nextElementSibling;
      if (note) note.textContent = "Not needed in the desktop app. Only add one if connecting keeps failing.";
    }
    const steps = document.querySelector(".steps");
    if (steps) steps.innerHTML = "<b>How it works:</b> copy a link and add it to TikTok LIVE Studio (Add source, then Link) or to OBS or Streamlabs (Browser source), at the size shown. "
      + "<b>Your links never change.</b> Edits you make here appear on stream by themselves. Keep Overlaya Studio open while you're live.";
  }
  document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    const inp = $("url-" + b.dataset.copy);
    try { await navigator.clipboard.writeText(inp.value); }
    catch (e) { inp.select(); document.execCommand("copy"); }
    b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1500);
  }));

  $("btnSo").addEventListener("click", () => engines.shoutout.trigger((cfg.shout.soCmd || "so") + " " + ($("trySo").value.trim() || "MidnightMika")));
  $("btnNote").addEventListener("click", () => engines.shoutout.trigger((cfg.shout.noteCmd || "note") + " " + ($("tryNote").value.trim() || "Giveaway at 10 PM")));
  $("backdrop").addEventListener("change", e => document.querySelectorAll(".pv .backdrop").forEach(d => d.className = "backdrop " + e.target.value));
  window.addEventListener("resize", fit);


  async function save(){
    const json = JSON.stringify(STORE, null, 2).replace(/</g, "\\u003c");
    const out = SOURCE.replace(/<script id="ovdesk">[\s\S]*?<\/script>\n?/, "").replace(/(<script type="application\/json" id="cfg">)[\s\S]*?(<\/script>)/, (m, a, b) => a + "\n" + json + "\n" + b);
    const download = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([out], { type: "text/html" }));
      a.download = "overlaya-studio.html";
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    try {
      if (window.showSaveFilePicker){
        if (!fileHandle) fileHandle = await showSaveFilePicker({ suggestedName: "overlaya-studio.html", types: [{ description: "Overlay", accept: { "text/html": [".html"] } }] });
        const w = await fileHandle.createWritable(); await w.write(out); await w.close();
        status("Backup saved to " + fileHandle.name + ".");
      } else { download(); status("Backup saved to your Downloads folder."); }
      dirty = false;
    } catch (e){
      if (e && e.name === "AbortError") return;
      download(); dirty = false; status("Backup saved to your Downloads folder.");
    }
  }
  $("save").addEventListener("click", save);

  rebuild();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
}
</script>
</body>
